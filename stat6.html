<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MintChart · Stat6 (2 ATRBot · 2 VSR · S&amp;D Zones)</title>

  <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="css/stat6.css">
</head>

<body>
  <!-- TOP PROGRESS BAR -->
  <div id="stat6-progress-bar-container">
    <div id="stat6-progress-bar-fill"></div>
  </div>

  <!-- TOPBAR -->
  <div id="stat6-topbar">
    <a href="index.html" class="tb-brand" title="Về MintChart gốc">
      <div class="tb-logo-badge">S6</div>
      <span class="tb-title">STAT6 <small>LIGHT</small></span>
    </a>

    <div class="tb-search-box">
      <span class="tb-search-icon">🔍</span>
      <input id="stat6-symbol-input" class="tb-search-input" type="text" placeholder="Search market..." readonly />
    </div>
    <span id="stat6-source-badge" class="tb-source-badge binance-futures">FUTURES</span>

    <div class="tb-intervals" id="stat6-interval-pills">
      <button class="stat6-iv-btn" data-iv="1m">1m</button>
      <button class="stat6-iv-btn" data-iv="5m">5m</button>
      <button class="stat6-iv-btn active" data-iv="15m">15m</button>
      <button class="stat6-iv-btn" data-iv="30m">30m</button>
      <button class="stat6-iv-btn" data-iv="1h">1h</button>
      <button class="stat6-iv-btn" data-iv="4h">4h</button>
      <button class="stat6-iv-btn" data-iv="1d">1D</button>
    </div>

    <div class="tb-ticker">
      <span id="stat6-ticker-price">—</span>
      <span id="stat6-ticker-change" class="stat6-badge-up">—</span>
    </div>

    <div class="tb-quick-toggles">
      <button class="quick-toggle-pill" id="qt6-atr1" title="Bật/tắt ATRBot 1"><span class="dot"></span> ATR1</button>
      <button class="quick-toggle-pill" id="qt6-atr2" title="Bật/tắt ATRBot 2"><span class="dot"></span> ATR2</button>
      <button class="quick-toggle-pill" id="qt6-vsr1" title="Bật/tắt VSR 1"><span class="dot"></span> VSR1</button>
      <button class="quick-toggle-pill" id="qt6-vsr2" title="Bật/tắt VSR 2"><span class="dot"></span> VSR2</button>
      <button class="quick-toggle-pill overlap" id="qt6-overlap" title="Bật/tắt Vùng Chồng Lấn 2 VSR"><span class="dot"></span> OVERLAP</button>
      <button class="quick-toggle-pill snd" id="qt6-snd" title="Bật/tắt Demand/Supply zones"><span class="dot"></span> S&amp;D</button>
    </div>

    <div id="stat6-status"><span class="stat6-status-dot"></span> Starting...</div>
  </div>

  <!-- TOOLBAR (S&D) -->
  <div id="stat6-toolbar">
    <div class="stat6-tool-group">
      <label class="stat6-tool-label">Preset</label>
      <select id="stat6-preset-select">
        <option value="conservative">Conservative</option>
        <option value="standard">Standard</option>
        <option value="aggressive">Aggressive</option>
      </select>
    </div>
    <div class="stat6-tool-group">
      <label class="stat6-tool-label">Min score</label>
      <input id="stat6-min-score" type="number" min="0" max="100" step="1" />
    </div>
    <div class="stat6-tool-sep"></div>
    <label class="stat6-check"><input type="checkbox" id="stat6-tf-RBR" /> RBR</label>
    <label class="stat6-check"><input type="checkbox" id="stat6-tf-DBD" /> DBD</label>
    <label class="stat6-check alt"><input type="checkbox" id="stat6-tf-RBD" /> RBD</label>
    <label class="stat6-check alt"><input type="checkbox" id="stat6-tf-DBR" /> DBR</label>
    <div class="stat6-tool-sep"></div>
    <label class="stat6-check"><input type="checkbox" id="stat6-show-tested" /> Show tested</label>
    <label class="stat6-check"><input type="checkbox" id="stat6-show-invalidated" /> Show invalidated</label>
  </div>

  <!-- CHART -->
  <div id="stat6-chart-wrapper">
    <div id="stat6-chart-container"></div>
    <canvas id="stat6-overlay-canvas"></canvas>

    <div id="stat6-legend"></div>
    <div id="stat6-zone-info"></div>

    <div id="stat6-zone-side">
      <div class="stat6-zone-side-title">S&amp;D Zones</div>
      <div id="stat6-zone-list"></div>
    </div>
  </div>

  <!-- SYMBOL SEARCH MODAL -->
  <div id="stat6-symbol-modal" class="stat6-modal-overlay" style="display:none">
    <div class="stat6-sym-modal-box">
      <div class="sym-search-header">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div class="sym-input-wrap" style="flex:1;">
            <span class="sym-input-icon">🔍</span>
            <input type="text" id="stat6-modal-search-input" placeholder="Tìm kiếm Symbol (BTC, ETH, EUR_USD...)" autocomplete="off" spellcheck="false" />
          </div>
          <button class="modal-close-btn" id="stat6-modal-search-close" style="padding:6px 10px;">✕</button>
        </div>
        <div class="sym-source-tabs" id="stat6-modal-source-tabs"></div>
        <div class="sym-filter-row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="stat6-filter-cached" /> Chỉ hiện mã đã cache
          </label>
          <span id="stat6-symbol-count" style="color:var(--text-dim);font-size:11px;">—</span>
        </div>
      </div>
      <div class="sym-list-pane" id="stat6-modal-symbol-list"></div>
    </div>
  </div>

  <!-- LOADING -->
  <div id="stat6-loading">
    <div class="stat6-loading-logo">S6</div>
    <div class="stat6-loading-text">Initializing...</div>
  </div>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/datasources.js"></script>
  <script src="js/stat2-indicators.js"></script>
  <script src="js/snd-config.js"></script>
  <script src="js/snd-atr.js"></script>
  <script src="js/snd-candle-classifier.js"></script>
  <script src="js/snd-zone-utils.js"></script>
  <script src="js/snd-zone-scorer.js"></script>
  <script src="js/snd-zone-detector.js"></script>
  <script src="js/stat6-config.js"></script>
  <script src="js/stat6-chart.js"></script>
  <script src="js/stat6-app.js"></script>
</body>

</html>
