<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MintChart · Stat2 (2 ATRBot, 2 VSR & Overlap)</title>

  <!-- Libraries -->
  <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="css/stat2.css">
</head>

<body>
  <!-- TOP PROGRESS BAR -->
  <div id="stat2-progress-bar-container">
    <div id="stat2-progress-bar-fill"></div>
  </div>

  <!-- TOPBAR -->
  <div id="stat2-topbar">
    <a href="index.html" class="tb-brand" title="Quay lại MintChart gốc">
      <div class="tb-logo-badge">M2</div>
      <span class="tb-title">STAT2 <small>PRO</small></span>
    </a>

    <a href="stat5.html" class="stat2-nav-link" title="Mở trang Stat5 (S&D + ATRBot + VSR)" style="margin-left:-4px;margin-right:2px;">⚡ Stat5</a>
    <a href="final.html" class="stat2-nav-link" title="Mở trang Final (Stat2 + ForexFlow Full Suite)" style="margin-right:2px;color:#e040fb;">🔥 Final</a>

    <!-- Symbol Search with DataSource Badge -->
    <div class="tb-search-box">
      <span class="tb-search-icon">🔍</span>
      <input id="stat2-symbol-input" class="tb-search-input" type="text" placeholder="Search market..." readonly />
    </div>
    <span id="stat2-source-badge" class="tb-source-badge binance-futures">FUTURES</span>

    <!-- Interval Pills -->
    <div class="tb-intervals" id="stat2-interval-pills">
      <button class="stat2-iv-btn" data-iv="1m">1m</button>
      <button class="stat2-iv-btn" data-iv="5m">5m</button>
      <button class="stat2-iv-btn active" data-iv="15m">15m</button>
      <button class="stat2-iv-btn" data-iv="1h">1h</button>
      <button class="stat2-iv-btn" data-iv="4h">4h</button>
      <button class="stat2-iv-btn" data-iv="1d">1D</button>
    </div>

    <!-- Realtime Ticker -->
    <div class="tb-ticker">
      <span id="stat2-ticker-price">—</span>
      <span id="stat2-ticker-change" class="badge-up">—</span>
    </div>

    <!-- Quick Toggle Pills -->
    <div class="tb-quick-toggles">
      <button class="quick-toggle-pill" id="qt-atr1" title="Bật/tắt ATRBot 1"><span class="dot"></span> ATR1</button>
      <button class="quick-toggle-pill" id="qt-atr2" title="Bật/tắt ATRBot 2"><span class="dot"></span> ATR2</button>
      <button class="quick-toggle-pill" id="qt-vsr1" title="Bật/tắt VSR 1"><span class="dot"></span> VSR1</button>
      <button class="quick-toggle-pill" id="qt-vsr2" title="Bật/tắt VSR 2"><span class="dot"></span> VSR2</button>
      <button class="quick-toggle-pill overlap" id="qt-overlap" title="Bật/tắt Vùng Chồng Lấn 2 VSR"><span class="dot"></span> OVERLAP</button>
      <button class="quick-toggle-pill" id="qt-strategy" title="Bật/tắt Chiến Lược & Lệnh"><span class="dot"></span> TRADES</button>
    </div>

    <!-- Status & Settings Gear -->
    <div id="stat2-status"><span class="ready-dot"></span> Starting...</div>
    <button class="tb-btn" id="stat2-open-settings-btn" title="Cài đặt thông số, màu sắc & nét vẽ">
      <span>⚙</span> Cài Đặt
    </button>
  </div>

  <!-- STRATEGY STATS BAR -->
  <div id="stat2-strategy-stats" style="display:none"></div>

  <!-- MAIN CHART WRAPPER -->
  <div id="stat2-chart-wrapper">
    <div id="stat2-chart-container"></div>
    <canvas id="stat2-overlay-canvas"></canvas>
    <div id="stat2-indicator-hud"></div>
  </div>

  <!-- SETTINGS MODAL ĐA TAB -->
  <div id="stat2-settings-modal" class="stat2-modal-overlay" style="display:none">
    <div class="stat2-settings-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">
          <span>⚙</span> Cài Đặt Tham Số & Giao Diện (Stat2)
        </div>
        <button class="modal-close-btn" id="stat2-settings-close-btn">✕</button>
      </div>
      <div class="settings-layout">
        <div class="settings-tabs-sidebar" id="stat2-settings-tabs"></div>
        <div class="settings-content-pane" id="stat2-settings-content"></div>
      </div>
    </div>
  </div>

  <!-- TRADE DETAIL MODAL -->
  <div id="stat2-trade-modal-overlay" class="stat2-modal-overlay" style="display:none"></div>

  <!-- SYMBOL SEARCH MODAL (MULTI-SOURCE) -->
  <div id="stat2-symbol-modal" class="stat2-modal-overlay" style="display:none">
    <div class="stat2-sym-modal-box" onclick="event.stopPropagation()">
      <div class="sym-search-header">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div class="sym-input-wrap" style="flex:1;">
            <span class="sym-input-icon">🔍</span>
            <input type="text" id="stat2-modal-search-input" placeholder="Tìm kiếm Symbol (BTC, ETH, EUR_USD, XAU...)" autocomplete="off" spellcheck="false" />
          </div>
          <button class="modal-close-btn" id="stat2-modal-search-close" style="padding:6px 10px;">✕</button>
        </div>

        <!-- Category & Data Source Filter Tabs -->
        <div class="sym-source-tabs" id="stat2-modal-source-tabs">
          <!-- Rendered dynamically -->
        </div>

        <div class="sym-filter-row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="stat2-filter-cached" /> Chỉ hiện mã đã cache
          </label>
          <span id="stat2-symbol-count" style="color:var(--text-dim);font-size:11px;">—</span>
        </div>
      </div>
      <div class="sym-list-pane" id="stat2-modal-symbol-list"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/datasources.js"></script>
  <script src="js/stat2-config.js"></script>
  <script src="js/stat2-indicators.js"></script>
  <script src="js/stat2-strategy.js"></script>
  <script src="js/stat2-chart.js"></script>
  <script src="js/stat2-ui.js"></script>
  <script src="js/stat2-main.js"></script>
</body>

</html>
