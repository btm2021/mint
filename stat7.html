<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MintChart · Stat7 (ForexFlow Full — 10k bars)</title>

  <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="css/stat7.css">
</head>

<body>
  <!-- TOP PROGRESS BAR -->
  <div id="stat5-progress-bar-container">
    <div id="stat5-progress-bar-fill"></div>
  </div>

  <!-- TOPBAR -->
  <div id="stat5-topbar">
    <a href="index.html" class="tb-brand" title="Về MintChart gốc">
      <div class="tb-logo-badge">S7</div>
      <span class="tb-title">STAT7 <small>FXFLOW</small></span>
    </a>

    <div class="tb-search-box">
      <span class="tb-search-icon">🔍</span>
      <input id="stat5-symbol-input" class="tb-search-input" type="text" placeholder="Search market..." readonly />
    </div>
    <span id="stat5-source-badge" class="tb-source-badge binance-futures">FUTURES</span>

    <!-- Interval Pills -->
    <div class="tb-intervals" id="stat5-interval-pills">
      <button class="stat5-iv-btn" data-iv="1m">1m</button>
      <button class="stat5-iv-btn" data-iv="5m">5m</button>
      <button class="stat5-iv-btn active" data-iv="15m">15m</button>
      <button class="stat5-iv-btn" data-iv="30m">30m</button>
      <button class="stat5-iv-btn" data-iv="1h">1h</button>
      <button class="stat5-iv-btn" data-iv="4h">4h</button>
      <button class="stat5-iv-btn" data-iv="1d">1D</button>
    </div>

    <!-- Realtime Ticker -->
    <div class="tb-ticker">
      <span id="stat5-ticker-price">—</span>
      <span id="stat5-ticker-change" class="stat5-badge-up">—</span>
    </div>

    <!-- Quick Toggle Pills -->
    <div class="tb-quick-toggles">
      <button class="quick-toggle-pill" id="qt5-atr1" title="Bật/tắt ATRBot 1"><span class="dot"></span> ATR1</button>
      <button class="quick-toggle-pill" id="qt5-atr2" title="Bật/tắt ATRBot 2"><span class="dot"></span> ATR2</button>
      <button class="quick-toggle-pill" id="qt5-vsr1" title="Bật/tắt VSR 1"><span class="dot"></span> VSR1</button>
      <button class="quick-toggle-pill" id="qt5-vsr2" title="Bật/tắt VSR 2"><span class="dot"></span> VSR2</button>
      <button class="quick-toggle-pill overlap" id="qt5-overlap" title="Bật/tắt Vùng Chồng Lấn 2 VSR"><span class="dot"></span> OVERLAP</button>
      <button class="quick-toggle-pill snd" id="qt5-snd" title="Bật/tắt Supply & Demand zones"><span class="dot"></span> S&amp;D</button>
    </div>

    <!-- Status & Settings -->
    <div id="stat5-status"><span class="stat5-status-dot"></span> Starting...</div>
    <button class="tb-btn" id="stat5-open-settings-btn" title="Cài đặt thông số & màu sắc">
      <span>⚙</span> Cài Đặt
    </button>
  </div>

  <!-- TOOLBAR (S&D + Analysis) -->
  <div id="stat5-toolbar">
    <div class="stat5-tool-group">
      <label class="stat5-tool-label">Preset</label>
      <select id="stat5-preset-select">
        <option value="conservative">Conservative</option>
        <option value="standard">Standard</option>
        <option value="aggressive">Aggressive</option>
      </select>
    </div>
    <div class="stat5-tool-group">
      <label class="stat5-tool-label">Min score</label>
      <input id="stat5-min-score" type="number" min="0" max="100" step="1" />
    </div>
    <div class="stat5-tool-sep"></div>
    <label class="stat5-check"><input type="checkbox" id="stat5-tf-RBR" /> RBR</label>
    <label class="stat5-check"><input type="checkbox" id="stat5-tf-DBD" /> DBD</label>
    <label class="stat5-check alt"><input type="checkbox" id="stat5-tf-RBD" /> RBD</label>
    <label class="stat5-check alt"><input type="checkbox" id="stat5-tf-DBR" /> DBR</label>
    <div class="stat5-tool-sep"></div>
    <label class="stat5-check"><input type="checkbox" id="stat5-show-tested" /> Show tested</label>
    <label class="stat5-check"><input type="checkbox" id="stat5-show-invalidated" /> Show invalidated</label>
    <div class="stat5-tool-sep"></div>
    <label class="stat5-check debug"><input type="checkbox" id="stat5-debug-toggle" /> DEBUG</label>
    <div class="stat5-tool-sep"></div>
    <label class="stat5-tool-label">Analysis</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-trend" /> Trend</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-div" /> Div</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-fib" /> Fib</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-keylevels" /> KeyL</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-regime" /> Regime</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-session" /> Session</label>
    <label class="stat5-check ana"><input type="checkbox" id="stat5-ana-conf" /> Bias</label>
    <label class="stat5-check ana pro"><input type="checkbox" id="stat5-ana-extscore" /> Pro score</label>
    <div class="stat5-tool-sep"></div>
    <button class="stat5-zone-toggle" id="stat5-zone-toggle-btn" title="Hiện/ẩn danh sách S&D zones">Zones ☰</button>
  </div>

  <!-- MAIN CHART -->
  <div id="stat5-chart-wrapper">
    <div id="stat5-chart-container"></div>
    <canvas id="stat5-overlay-canvas"></canvas>

    <div id="stat5-legend"></div>
    <div id="stat5-indicator-hud"></div>
    <div id="stat7-bias-panel"></div>
    <div id="stat5-zone-info"></div>

    <div id="stat5-zone-side">
      <div class="stat5-zone-side-title">S&amp;D Zones (pro = 7 enhancers)</div>
      <div id="stat5-zone-list"></div>
    </div>
  </div>

  <!-- DEBUG PANEL -->
  <div id="stat5-debug-panel">
    <div class="stat5-debug-header">
      <span>Detector Debug Log</span>
      <button id="stat5-debug-clear">Clear</button>
    </div>
    <div id="stat5-debug-body"></div>
  </div>

  <!-- SETTINGS MODAL ĐA TAB -->
  <div id="stat5-settings-modal" class="stat5-modal-overlay" style="display:none">
    <div class="stat5-settings-card">
      <div class="modal-header">
        <div class="modal-title">
          <span>⚙</span> Cài Đặt Tham Số &amp; Giao Diện (Stat7)
        </div>
        <button class="modal-close-btn" id="stat5-settings-close-btn">✕</button>
      </div>
      <div class="settings-layout">
        <div class="settings-tabs-sidebar" id="stat5-settings-tabs"></div>
        <div class="settings-content-pane" id="stat5-settings-content"></div>
      </div>
    </div>
  </div>

  <!-- SYMBOL SEARCH MODAL (MULTI-SOURCE) -->
  <div id="stat5-symbol-modal" class="stat5-modal-overlay" style="display:none">
    <div class="stat5-sym-modal-box">
      <div class="sym-search-header">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div class="sym-input-wrap" style="flex:1;">
            <span class="sym-input-icon">🔍</span>
            <input type="text" id="stat5-modal-search-input" placeholder="Tìm kiếm Symbol (BTC, ETH, EUR_USD...)" autocomplete="off" spellcheck="false" />
          </div>
          <button class="modal-close-btn" id="stat5-modal-search-close" style="padding:6px 10px;">✕</button>
        </div>
        <div class="sym-source-tabs" id="stat5-modal-source-tabs"></div>
        <div class="sym-filter-row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="stat5-filter-cached" /> Chỉ hiện mã đã cache
          </label>
          <span id="stat5-symbol-count" style="color:var(--text-dim);font-size:11px;">—</span>
        </div>
      </div>
      <div class="sym-list-pane" id="stat5-modal-symbol-list"></div>
    </div>
  </div>

  <!-- LOADING -->
  <div id="stat5-loading">
    <div class="stat5-loading-logo">S7</div>
    <div class="stat5-loading-text">Initializing...</div>
  </div>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/datasources.js"></script>
  <script src="js/stat2-indicators.js"></script>
  <script src="js/snd-config.js"></script>
  <script src="js/snd-atr.js"></script>
  <script src="js/snd-candle-classifier.js"></script>
  <script src="js/snd-zone-utils.js"></script>
  <script src="js/snd-zone-scorer.js"></script>
  <script src="js/snd-zone-detector.js"></script>
  <script src="js/ffx-technicals.js"></script>
  <script src="js/ffx-trend.js"></script>
  <script src="js/ffx-analysis.js"></script>
  <script src="js/stat7-config.js"></script>
  <script src="js/stat5-config.js"></script>
  <script src="js/stat5-chart.js"></script>
  <script src="js/stat5-settings.js"></script>
  <script src="js/stat7-app.js"></script>
</body>

</html>
